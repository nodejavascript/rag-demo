# =============================================================================
# rag — one app container, and nothing else on the host belongs to it.
#
# The Caddy that serves the nine other sites on this droplet runs on the HOST (a
# systemd unit reading /etc/caddy/Caddyfile), so this stack publishes the app on
# loopback only and Caddy reverse-proxies to it. That keeps certificate renewal and
# the other sites exactly as they were.
#
# The `deploy.resources` limits are not decoration. This box has 1 GB of RAM shared
# with nine other sites and a Postgres; an unbounded Node process plus a large paste
# would take the whole machine down, and the blast radius would be every site George
# runs, not this one.
# =============================================================================

services:
  rag:
    build: .
    image: rag:latest
    container_name: rag
    restart: unless-stopped
    ports:
      # Loopback only. Caddy on the host is the only thing that may reach it.
      - "127.0.0.1:4500:4500"
    environment:
      PORT: "4500"
      HOST: "0.0.0.0"
      DB_PATH: "/data/rag.db"
      # How long an anonymous paste is kept before the sweeper removes it.
      DOC_TTL_HOURS: "${DOC_TTL_HOURS:-24}"
      # Hard ceiling on a paste, in characters. Beyond this the index is slow to
      # search and crowds the memory the other sites on this host need.
      # Raised from 400000 on 22 Sep 2026 ON A MEASUREMENT: a 508,035-character book
      # (rays-of-wit.pdf, 681 notes) indexed here in 9.6 s, grew the store by 8.25 MB, answered in
      # 110-362 ms, and held the server at 104 MB. 1,000,000 is about twice that case.
      MAX_DOCUMENT_CHARS: "${MAX_DOCUMENT_CHARS:-1000000}"
      # Two pastes may be embedded at once; the rest wait rather than thrash.
      MAX_CONCURRENT_INDEX: "${MAX_CONCURRENT_INDEX:-2}"
      INDEX_PER_HOUR: "${INDEX_PER_HOUR:-40}"
      ASK_PER_HOUR: "${ASK_PER_HOUR:-240}"
      # 🔴 THE NETS THAT A PUBLIC AFTERNOON NEEDS, all justified in `src/limits.ts`.
      # An ANSWER is a remote model call of 2–20 seconds, and a question asking for a list
      # now reads the whole document; without a cap, every simultaneous clicker held a long
      # call and a socket on a box that has ~314 MB free. The caller over the line is told.
      MAX_CONCURRENT_ASK: "${MAX_CONCURRENT_ASK:-3}"
      # An hour used to be counted in DOCUMENTS, which made forty maximum pastes and forty
      # one-line notes the same allowance. This counts the thing that actually costs.
      # Two maximum-size documents an hour — this must move with the ceiling above, or a
      # reader is told their document is fine and then stopped by a net they cannot see.
      INDEX_CHARS_PER_HOUR: "${INDEX_CHARS_PER_HOUR:-2000000}"
      # Ceiling on the store itself. Past it the demo refuses new work and says when the
      # space comes back, rather than filling a disk shared with nine other sites.
      MAX_STORE_MB: "${MAX_STORE_MB:-150}"
      # 🔴 NODE'S OWN HEAP, INSIDE ITS OWN CONTAINER. Without a ceiling a large paste makes
      # Node grow until the cgroup kills it and the container restarts mid-index; with one,
      # it collects hard instead. 192 MB inside a 288 MB cap leaves room for the rest of
      # the process (the SQLite pages, the buffers, the parser) without asking for more.
      NODE_OPTIONS: "--max-old-space-size=192"
      # --- the model -------------------------------------------------------
      # `ollama`   → a model on the same machine. No key, no vendor.
      # `openai`   → anything speaking the OpenAI shape, including DigitalOcean
      #              Gradient AI (https://inference.do-ai.run/v1).
      #
      # ⚠ The key is read from a FILE, never from this file and never from git.
      # On the droplet it lives beside this compose file and is mounted below.
      MODEL_PROVIDER: "${MODEL_PROVIDER:-ollama}"
      MODEL_BASE_URL: "${MODEL_BASE_URL:-http://host.docker.internal:11434}"
      MODEL_API_KEY_FILE: "${MODEL_API_KEY_FILE:-/run/secrets/model_key}"
      CHAT_MODEL: "${CHAT_MODEL:-qwen2.5:7b}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text}"
      # A cross-encoder is a real quality win when the provider has one. Measured
      # per embedding model — never carry a floor over from another one.
      RERANK_MODEL: "${RERANK_MODEL:-}"
      REFUSAL_FLOOR: "${REFUSAL_FLOOR:-0.56}"
    extra_hosts:
      # So the container can reach an Ollama running on the host, if that is how the
      # models are served. Unused when MODEL_BASE_URL points somewhere remote.
      - "host.docker.internal:host-gateway"
    volumes:
      - rag-data:/data
      # Read-only, and only if the file is there. The key never enters the image.
      - ./secrets:/run/secrets:ro
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-384M}
        reservations:
          memory: 96M

volumes:
  rag-data:
